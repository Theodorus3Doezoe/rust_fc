<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Orientation Visualizer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        .canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0.75rem;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <span class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                <svg class="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
                Ratel Drone Telemetry
            </span>
            <span id="connection-badge" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-950 text-red-400 border border-red-800 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                Disconnected
            </span>
        </div>

        <!-- Serial Controls -->
        <div class="flex items-center gap-3">
            <select id="port-select" class="bg-slate-950 border border-slate-800 text-slate-300 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2 w-48">
                <option value="">Scanning ports...</option>
            </select>
            <button id="refresh-ports-btn" class="p-2 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg transition" title="Refresh Ports">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.228 5.6M7 16l-4 4 4 4m0-6h18" />
                </svg>
            </button>
            <button id="connect-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm px-4 py-2 rounded-lg shadow-lg shadow-indigo-500/20 transition duration-200">
                Connect
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 overflow-hidden">
        <!-- 3D Visualization Column -->
        <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col h-full min-h-[400px]">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-semibold text-white">3D Orientation</h2>
                <div class="text-xs text-slate-400 flex gap-4">
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 bg-red-500 inline-block rounded"></span> Front (X)</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 bg-green-500 inline-block rounded"></span> Right (Y)</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 bg-blue-500 inline-block rounded"></span> Top (Z)</span>
                </div>
            </div>
            <div id="canvas-container" class="canvas-container flex-1 bg-slate-950 rounded-xl relative overflow-hidden">
                <!-- Three.js Canvas mounts here -->
            </div>
        </div>

        <!-- Telemetry Values & Chart Column -->
        <div class="flex flex-col gap-6 h-full">
            <!-- Telemetry Readouts -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                <h2 class="text-lg font-semibold text-white mb-4">Live Values</h2>
                
                <div class="grid grid-cols-3 gap-4 mb-6">
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800">
                        <div class="text-xs text-slate-400 mb-1">Roll</div>
                        <div id="val-roll" class="text-xl font-bold text-white">0.0°</div>
                    </div>
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800">
                        <div class="text-xs text-slate-400 mb-1">Pitch</div>
                        <div id="val-pitch" class="text-xl font-bold text-white">0.0°</div>
                    </div>
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800">
                        <div class="text-xs text-slate-400 mb-1">Yaw</div>
                        <div id="val-yaw" class="text-xl font-bold text-white">0.0°</div>
                    </div>
                </div>

                <div class="space-y-3">
                    <div>
                        <div class="text-xs text-slate-400 mb-1.5 flex justify-between">
                            <span>Accelerometer (g)</span>
                            <span id="val-accel" class="font-mono text-slate-300">[0.00, 0.00, 0.00]</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 h-1.5 bg-slate-950 rounded-full overflow-hidden">
                            <div id="bar-ax" class="bg-red-500 w-0 transition-all duration-75"></div>
                            <div id="bar-ay" class="bg-green-500 w-0 transition-all duration-75"></div>
                            <div id="bar-az" class="bg-blue-500 w-0 transition-all duration-75"></div>
                        </div>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400 mb-1.5 flex justify-between">
                            <span>Gyroscope (°/s)</span>
                            <span id="val-gyro" class="font-mono text-slate-300">[0.00, 0.00, 0.00]</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 h-1.5 bg-slate-950 rounded-full overflow-hidden">
                            <div id="bar-gx" class="bg-red-500 w-0 transition-all duration-75"></div>
                            <div id="bar-gy" class="bg-green-500 w-0 transition-all duration-75"></div>
                            <div id="bar-gz" class="bg-blue-500 w-0 transition-all duration-75"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Historical Chart -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex-1 flex flex-col">
                <h2 class="text-lg font-semibold text-white mb-3">Orientation History</h2>
                <div class="flex-1 relative w-full h-[200px]">
                    <canvas id="history-chart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript logic -->
    <script>
        // DOM Elements
        const portSelect = document.getElementById('port-select');
        const refreshPortsBtn = document.getElementById('refresh-ports-btn');
        const connectBtn = document.getElementById('connect-btn');
        const connectionBadge = document.getElementById('connection-badge');
        
        const valRoll = document.getElementById('val-roll');
        const valPitch = document.getElementById('val-pitch');
        const valYaw = document.getElementById('val-yaw');
        const valAccel = document.getElementById('val-accel');
        const valGyro = document.getElementById('val-gyro');
        
        const barAx = document.getElementById('bar-ax');
        const barAy = document.getElementById('bar-ay');
        const barAz = document.getElementById('bar-az');
        const barGx = document.getElementById('bar-gx');
        const barGy = document.getElementById('bar-gy');
        const barGz = document.getElementById('bar-gz');

        let isConnected = false;
        let ws = null;

        // 3D Visualizer Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020617); // slate-950

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(4, 3, 5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Grid helper
        const gridHelper = new THREE.GridHelper(10, 20, 0x475569, 0x1e293b);
        gridHelper.position.y = -1;
        scene.add(gridHelper);

        // Drone/Board model
        // A simple board with colored faces representing the drone orientation
        const geometry = new THREE.BoxGeometry(2, 0.2, 1.2);
        
        // Materials for faces: X+, X-, Y+, Y-, Z+, Z-
        // Right face: Red, Left face: Slate
        // Top face: Blue, Bottom face: Dark Slate
        // Front face: Green, Back face: Slate
        const materials = [
            new THREE.MeshLambertMaterial({ color: 0xef4444 }), // X+ (Right)
            new THREE.MeshLambertMaterial({ color: 0x475569 }), // X- (Left)
            new THREE.MeshLambertMaterial({ color: 0x10b981 }), // Y+ (Top)
            new THREE.MeshLambertMaterial({ color: 0x1e293b }), // Y- (Bottom)
            new THREE.MeshLambertMaterial({ color: 0x3b82f6 }), // Z+ (Front)
            new THREE.MeshLambertMaterial({ color: 0x475569 })  // Z- (Back)
        ];
        
        const droneMesh = new THREE.Mesh(geometry, materials);
        scene.add(droneMesh);

        // Arm indicators (cross shape for drone)
        const armGeo = new THREE.BoxGeometry(0.15, 0.08, 2.5);
        const armMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
        const arm1 = new THREE.Mesh(armGeo, armMat);
        const arm2 = new THREE.Mesh(armGeo, armMat);
        arm2.rotation.y = Math.PI / 2;
        droneMesh.add(arm1);
        droneMesh.add(arm2);

        // Propellers (small cylinders on the arms)
        const propGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.02, 16);
        const propMat = new THREE.MeshBasicMaterial({ color: 0x64748b, transparent: true, opacity: 0.6 });
        const props = [
            new THREE.Mesh(propGeo, propMat),
            new THREE.Mesh(propGeo, propMat),
            new THREE.Mesh(propGeo, propMat),
            new THREE.Mesh(propGeo, propMat)
        ];
        
        props[0].position.set(0.9, 0.1, 0.9);
        props[1].position.set(-0.9, 0.1, 0.9);
        props[2].position.set(0.9, 0.1, -0.9);
        props[3].position.set(-0.9, 0.1, -0.9);
        props.forEach(p => droneMesh.add(p));

        // Render loop
        function animate() {
            requestAnimationFrame(animate);
            // Spin propellers slowly
            props.forEach(p => p.rotation.y += 0.2);
            renderer.render(scene, camera);
        }
        animate();

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Chart.js Setup
        const ctx = document.getElementById('history-chart').getContext('2d');
        const maxSamples = 100;
        const labels = Array(maxSamples).fill('');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Roll',
                        borderColor: '#ef4444',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        data: Array(maxSamples).fill(0),
                        tension: 0.1
                    },
                    {
                        label: 'Pitch',
                        borderColor: '#10b981',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        data: Array(maxSamples).fill(0),
                        tension: 0.1
                    },
                    {
                        label: 'Yaw',
                        borderColor: '#3b82f6',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        data: Array(maxSamples).fill(0),
                        tension: 0.1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    x: { display: false },
                    y: {
                        grid: { color: '#1e293b' },
                        ticks: { color: '#94a3b8' },
                        min: -180,
                        max: 180
                    }
                },
                plugins: {
                    legend: {
                        labels: { color: '#f8fafc' }
                    }
                }
            }
        });

        // Get Available Ports
        async function fetchPorts() {
            try {
                const res = await fetch('/api/ports');
                const data = await res.json();
                portSelect.innerHTML = '';
                if (data.ports.length === 0) {
                    portSelect.innerHTML = '<option value="">No ports found</option>';
                    return;
                }
                data.ports.forEach(port => {
                    const opt = document.createElement('option');
                    opt.value = port;
                    opt.textContent = port;
                    if (port === data.default) {
                        opt.selected = true;
                    }
                    portSelect.appendChild(opt);
                });
            } catch (err) {
                console.error("Error fetching ports:", err);
            }
        }

        // Get Connection Status on load
        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                isConnected = data.connected;
                updateUIState();
                if (isConnected) {
                    initWebSocket();
                }
            } catch (err) {
                console.error("Error checking status:", err);
            }
        }

        function updateUIState() {
            if (isConnected) {
                connectBtn.textContent = 'Disconnect';
                connectBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500');
                connectBtn.classList.add('bg-rose-600', 'hover:bg-rose-500');
                connectionBadge.className = "px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800 flex items-center gap-1.5";
                connectionBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Connected`;
                portSelect.disabled = true;
            } else {
                connectBtn.textContent = 'Connect';
                connectBtn.classList.remove('bg-rose-600', 'hover:bg-rose-500');
                connectBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-500');
                connectionBadge.className = "px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-950 text-red-400 border border-red-800 flex items-center gap-1.5";
                connectionBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> Disconnected`;
                portSelect.disabled = false;
            }
        }

        // Initialize WebSocket Connection
        function initWebSocket() {
            if (ws) {
                ws.close();
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                // 1. Update text displays
                valRoll.textContent = `${data.roll.toFixed(1)}°`;
                valPitch.textContent = `${data.pitch.toFixed(1)}°`;
                valYaw.textContent = `${data.yaw.toFixed(1)}°`;
                valAccel.textContent = `[${data.accel_x.toFixed(2)}, ${data.accel_y.toFixed(2)}, ${data.accel_z.toFixed(2)}]`;
                valGyro.textContent = `[${data.gyro_x.toFixed(0)}, ${data.gyro_y.toFixed(0)}, ${data.gyro_z.toFixed(0)}]`;

                // 2. Update bar displays (percentage bounds - scaled for display)
                // Accel max display scale is 2g
                barAx.style.width = `${Math.min(100, Math.max(0, (data.accel_x + 2) / 4 * 100))}%`;
                barAy.style.width = `${Math.min(100, Math.max(0, (data.accel_y + 2) / 4 * 100))}%`;
                barAz.style.width = `${Math.min(100, Math.max(0, (data.accel_z + 2) / 4 * 100))}%`;
                // Gyro max display scale is 500 deg/s
                barGx.style.width = `${Math.min(100, Math.max(0, (data.gyro_x + 500) / 1000 * 100))}%`;
                barGy.style.width = `${Math.min(100, Math.max(0, (data.gyro_y + 500) / 1000 * 100))}%`;
                barGz.style.width = `${Math.min(100, Math.max(0, (data.gyro_z + 500) / 1000 * 100))}%`;

                // 3. Update 3D Rotation directly from quaternion (smooth, no gimbal lock)
                // Map Drone axes to Three.js axes:
                // Three.js X (lateral) = Drone Y (Pitch) -> qy
                // Three.js Y (vertical) = Drone Z (Yaw) -> qz
                // Three.js Z (longitudinal) = Drone X (Roll) -> qx
                droneMesh.quaternion.set(data.qy, data.qz, data.qx, data.qw);

                // 4. Update History Chart
                chart.data.datasets[0].data.push(data.roll);
                chart.data.datasets[1].data.push(data.pitch);
                chart.data.datasets[2].data.push(data.yaw);

                chart.data.datasets[0].data.shift();
                chart.data.datasets[1].data.shift();
                chart.data.datasets[2].data.shift();

                chart.update('none'); // Update without full animation for performance
            };

            ws.onclose = () => {
                console.log("WebSocket connection closed");
                if (isConnected) {
                    // Try to reconnect in 1 second
                    setTimeout(initWebSocket, 1000);
                }
            };
        }

        // Toggle Connect/Disconnect
        connectBtn.addEventListener('click', async () => {
            if (isConnected) {
                // Disconnect
                try {
                    const res = await fetch('/api/disconnect', { method: 'POST' });
                    const data = await res.json();
                    if (data.status === 'success') {
                        isConnected = false;
                        updateUIState();
                        if (ws) {
                            ws.close();
                            ws = null;
                        }
                    }
                } catch (err) {
                    console.error("Error disconnecting:", err);
                }
            } else {
                // Connect
                const selectedPort = portSelect.value;
                if (!selectedPort) {
                    alert("Please select a serial port");
                    return;
                }
                
                try {
                    const res = await fetch('/api/connect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ port: selectedPort, baudrate: 115200 })
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        isConnected = true;
                        updateUIState();
                        initWebSocket();
                    } else {
                        alert(data.message || "Failed to connect");
                    }
                } catch (err) {
                    console.error("Error connecting:", err);
                    alert("Failed to connect");
                }
            }
        });

        refreshPortsBtn.addEventListener('click', fetchPorts);

        // Initial actions
        fetchPorts();
        checkStatus();
    </script>
</body>
</html>
