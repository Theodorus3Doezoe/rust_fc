[package]
name = "embassy-rp-test"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m-rt = "0.7.5"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-executor = { version = "0.10.0", features = [
  "platform-cortex-m",
  "executor-thread",
  "defmt",
] }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "defmt", "time-driver", "critical-section-impl"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
heapless = "0.9.3"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
vqf-rs = { version = "0.3.0", default-features = false, features = ["libm"] }
