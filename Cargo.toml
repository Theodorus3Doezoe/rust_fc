[package]
name = "embassy-rp-test"
version = "0.1.0"
edition = "2024"

[features]
tenstar_devboard = []

[dependencies]
biquad = "0.6.0"
cortex-m-rt = "0.7.5"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = [
  "platform-cortex-m",
  "executor-thread",
  "defmt",
  "executor-interrupt",
] }
embassy-rp = { version = "0.10.0", features = [
  "rp235xa",
  "defmt",
  "time-driver",
  "critical-section-impl",
] }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-usb-logger = "0.6.0"
embedded-hal-async = "1.0.0"

embedded-hal-bus = { version = "0.3", features = ["async"] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"

heapless = "0.9.3"
log = "0.4.33"
nalgebra = { version = "*", default-features = false, features = ["libm"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"
uf-ahrs = "0.2.1"

[profile.release]
opt-level = 3
codegen-units = 1 # Dwingt de compiler om alle modules als één geheel te optimaliseren
lto = "fat"       # Link-Time Optimization: inlineert ook code uit externe crates (zoals VQF en nalgebra)
panic = "abort"   # Verwijdert onnodige stack-unwinding code
